name: kiban-production

x-worker-base: &worker-base
  profiles: ["workers"]
  build:
    context: ..
    dockerfile: Dockerfile
  secrets:
    - postgres_dsn
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - backend
  read_only: true
  tmpfs:
    - /tmp
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${KIBAN_POSTGRES_DB:-kiban}
      POSTGRES_USER: ${KIBAN_POSTGRES_USER:-kiban}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - uvicorn
      - forecast_provider.api.factory:from_environment
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      KIBAN_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn
      KIBAN_AUTH_MODE: oidc
      KIBAN_DEPLOYMENT_MODE: production
      KIBAN_ALLOWED_HOSTS: ${KIBAN_DOMAIN:?KIBAN_DOMAIN is required},api
      KIBAN_OIDC_ISSUER: ${KIBAN_OIDC_ISSUER:?KIBAN_OIDC_ISSUER is required}
      KIBAN_OIDC_AUDIENCE: ${KIBAN_OIDC_AUDIENCE:?KIBAN_OIDC_AUDIENCE is required}
      KIBAN_OIDC_JWKS_URL: ${KIBAN_OIDC_JWKS_URL:?KIBAN_OIDC_JWKS_URL is required}
      KIBAN_OIDC_AUTHORIZATION_URL: ${KIBAN_OIDC_AUTHORIZATION_URL:?KIBAN_OIDC_AUTHORIZATION_URL is required}
      KIBAN_OIDC_TOKEN_URL: ${KIBAN_OIDC_TOKEN_URL:?KIBAN_OIDC_TOKEN_URL is required}
      KIBAN_OIDC_CLIENT_ID: ${KIBAN_OIDC_CLIENT_ID:?KIBAN_OIDC_CLIENT_ID is required}
      KIBAN_OIDC_SCOPES: ${KIBAN_OIDC_SCOPES:-openid profile}
      KIBAN_OIDC_ROLE_CLAIM: ${KIBAN_OIDC_ROLE_CLAIM:-roles}
      KIBAN_OIDC_ROLE_MAPPING: ${KIBAN_OIDC_ROLE_MAPPING:?KIBAN_OIDC_ROLE_MAPPING is required}
      KIBAN_OIDC_ALGORITHMS: ${KIBAN_OIDC_ALGORITHMS:-RS256}
      KIBAN_OIDC_LEEWAY_SECONDS: ${KIBAN_OIDC_LEEWAY_SECONDS:-60}
      KIBAN_SNAPSHOT_ROOT: /var/lib/kiban/snapshots
      KIBAN_REPORT_ROOT: /var/lib/kiban/reports
    secrets:
      - postgres_dsn
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(urllib.request.Request('http://api:8000/ready',headers={'Host':'api'}),timeout=5)
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_SNAPSHOT_DIR:-../snapshot_input}:/var/lib/kiban/snapshots:ro
      - ${KIBAN_REPORT_DIR:-../report_output}:/var/lib/kiban/reports
    networks:
      - edge
      - backend
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      KIBAN_DOMAIN: ${KIBAN_DOMAIN:?KIBAN_DOMAIN is required}
      KIBAN_ACME_EMAIL: ${KIBAN_ACME_EMAIL:?KIBAN_ACME_EMAIL is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  run-worker:
    <<: *worker-base
    command:
      - kiban-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
      - --builtin-baseline
      - --worker-id
      - production-baseline-1
      - --artifact-root
      - /var/lib/kiban/artifacts
      - --work-root
      - /var/lib/kiban/work
    volumes:
      - worker-state:/var/lib/kiban
      - ${KIBAN_SNAPSHOT_DIR:-../snapshot_input}:/var/lib/kiban/snapshots:ro

  statsforecast-worker:
    <<: *worker-base
    command:
      - kiban-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
      - --statsforecast-ets
      - --worker-id
      - production-autoets-1
      - --artifact-root
      - /var/lib/kiban/artifacts
      - --work-root
      - /var/lib/kiban/work
    volumes:
      - worker-state:/var/lib/kiban
      - ${KIBAN_SNAPSHOT_DIR:-../snapshot_input}:/var/lib/kiban/snapshots:ro

  mlforecast-worker:
    <<: *worker-base
    command:
      - kiban-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
      - --mlforecast-ridge
      - --worker-id
      - production-mlforecast-ridge-1
      - --artifact-root
      - /var/lib/kiban/artifacts
      - --work-root
      - /var/lib/kiban/work
    volumes:
      - worker-state:/var/lib/kiban
      - ${KIBAN_SNAPSHOT_DIR:-../snapshot_input}:/var/lib/kiban/snapshots:ro

  timesfm-worker:
    <<: *worker-base
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        KIBAN_INSTALL_TIMESFM_TORCH: "1"
    environment:
      KIBAN_TIMESFM_CHECKPOINT: /var/lib/kiban/timesfm/model.safetensors
    command:
      - kiban-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
      - --timesfm-2p5
      - --worker-id
      - production-timesfm-2p5-1
      - --artifact-root
      - /var/lib/kiban/artifacts
      - --work-root
      - /var/lib/kiban/work
    volumes:
      - worker-state:/var/lib/kiban
      - ${KIBAN_SNAPSHOT_DIR:-../snapshot_input}:/var/lib/kiban/snapshots:ro
      - ${KIBAN_TIMESFM_DIR:?KIBAN_TIMESFM_DIR is required}:/var/lib/kiban/timesfm:ro
    deploy:
      resources:
        limits:
          cpus: ${KIBAN_TIMESFM_CPUS:-2.0}
          memory: ${KIBAN_TIMESFM_MEMORY:-4G}

  timesfm-benchmark:
    profiles: ["operations"]
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        KIBAN_INSTALL_TIMESFM_TORCH: "1"
    environment:
      KIBAN_TIMESFM_CHECKPOINT: /var/lib/kiban/timesfm/model.safetensors
    command:
      - kiban-timesfm-benchmark
      - --output-root
      - /var/lib/kiban/benchmark
      - --cpu-limit
      - ${KIBAN_TIMESFM_CPUS:-2.0}
      - --memory-limit-bytes
      - ${KIBAN_TIMESFM_MEMORY_BYTES:-4294967296}
      - --max-peak-rss-bytes
      - ${KIBAN_TIMESFM_MEMORY_BYTES:-4294967296}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_TIMESFM_DIR:?KIBAN_TIMESFM_DIR is required}:/var/lib/kiban/timesfm:ro
      - ${KIBAN_TIMESFM_BENCHMARK_DIR:?KIBAN_TIMESFM_BENCHMARK_DIR is required}:/var/lib/kiban/benchmark
    deploy:
      resources:
        limits:
          cpus: ${KIBAN_TIMESFM_CPUS:-2.0}
          memory: ${KIBAN_TIMESFM_MEMORY:-4G}

  import-worker:
    <<: *worker-base
    command:
      - kiban-import-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
      - --input-root
      - /var/lib/kiban/import-input
      - --archive-root
      - /var/lib/kiban/raw-archive
    volumes:
      - ${KIBAN_IMPORT_DIR:-../import_input}:/var/lib/kiban/import-input:ro
      - ${KIBAN_RAW_ARCHIVE_DIR:-../raw_archive}:/var/lib/kiban/raw-archive

  normalization-worker:
    <<: *worker-base
    command:
      - kiban-normalization-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
    volumes:
      - ${KIBAN_RAW_ARCHIVE_DIR:-../raw_archive}:/var/lib/kiban/raw-archive:ro

  matching-worker:
    <<: *worker-base
    command:
      - kiban-matching-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn

  daily-worker:
    <<: *worker-base
    command:
      - kiban-daily-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
      - --output-root
      - /var/lib/kiban/snapshots
    volumes:
      - ${KIBAN_SNAPSHOT_DIR:-../snapshot_input}:/var/lib/kiban/snapshots

  acceptance-worker:
    <<: *worker-base
    command:
      - kiban-acceptance-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
      - --output-root
      - /var/lib/kiban/acceptance
    volumes:
      - ${KIBAN_SNAPSHOT_DIR:-../snapshot_input}:/var/lib/kiban/snapshots:ro
      - ${KIBAN_ACCEPTANCE_DIR:-../acceptance_output}:/var/lib/kiban/acceptance

  real-data-preflight:
    profiles: ["preflight"]
    build:
      context: ..
      dockerfile: Dockerfile
    secrets:
      - postgres_dsn
    command:
      - kiban-real-data-preflight
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
      - --application-root
      - /app
      - --import-root
      - /var/lib/kiban/import-input
      - --archive-root
      - /var/lib/kiban/raw-archive
      - --snapshot-root
      - /var/lib/kiban/snapshots
      - --acceptance-root
      - /var/lib/kiban/acceptance
      - --output-root
      - /var/lib/kiban/preflight
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_IMPORT_DIR:?KIBAN_IMPORT_DIR is required}:/var/lib/kiban/import-input:ro
      - ${KIBAN_RAW_ARCHIVE_DIR:?KIBAN_RAW_ARCHIVE_DIR is required}:/var/lib/kiban/raw-archive
      - ${KIBAN_SNAPSHOT_DIR:?KIBAN_SNAPSHOT_DIR is required}:/var/lib/kiban/snapshots
      - ${KIBAN_ACCEPTANCE_DIR:?KIBAN_ACCEPTANCE_DIR is required}:/var/lib/kiban/acceptance
      - ${KIBAN_PREFLIGHT_DIR:?KIBAN_PREFLIGHT_DIR is required}:/var/lib/kiban/preflight

  oidc-preflight:
    profiles: ["preflight"]
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - kiban-oidc-preflight
      - --issuer
      - ${KIBAN_OIDC_ISSUER:?KIBAN_OIDC_ISSUER is required}
      - --authorization-url
      - ${KIBAN_OIDC_AUTHORIZATION_URL:?KIBAN_OIDC_AUTHORIZATION_URL is required}
      - --token-url
      - ${KIBAN_OIDC_TOKEN_URL:?KIBAN_OIDC_TOKEN_URL is required}
      - --jwks-url
      - ${KIBAN_OIDC_JWKS_URL:?KIBAN_OIDC_JWKS_URL is required}
      - --algorithms
      - ${KIBAN_OIDC_ALGORITHMS:-RS256}
      - --output-root
      - /var/lib/kiban/oidc-preflight
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_OIDC_PREFLIGHT_DIR:?KIBAN_OIDC_PREFLIGHT_DIR is required}:/var/lib/kiban/oidc-preflight

  mapping-dry-run:
    profiles: ["mapping-preflight"]
    build:
      context: ..
      dockerfile: Dockerfile
    command:
      - kiban-mapping-dry-run
      - --input-root
      - /var/lib/kiban/import-input
      - --source
      - ${KIBAN_MAPPING_SOURCE:?KIBAN_MAPPING_SOURCE is required}
      - --mapping-file
      - /etc/kiban/mapping.json
      - --output-root
      - /var/lib/kiban/mapping-dry-run
      - --sample-rows
      - ${KIBAN_MAPPING_SAMPLE_ROWS:-1000}
      - --max-source-bytes
      - ${KIBAN_MAPPING_MAX_SOURCE_BYTES:-100000000}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_IMPORT_DIR:?KIBAN_IMPORT_DIR is required}:/var/lib/kiban/import-input:ro
      - ${KIBAN_MAPPING_FILE:?KIBAN_MAPPING_FILE is required}:/etc/kiban/mapping.json:ro
      - ${KIBAN_MAPPING_DRY_RUN_DIR:?KIBAN_MAPPING_DRY_RUN_DIR is required}:/var/lib/kiban/mapping-dry-run

  selection-worker:
    <<: *worker-base
    command:
      - kiban-selection-worker
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn

  lifecycle-scheduler:
    <<: *worker-base
    command:
      - kiban-lifecycle-scheduler
      - --postgres-dsn-file
      - /run/secrets/postgres_dsn
      - --poll-seconds
      - "60"

  db-operations:
    profiles: ["operations"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.operations
    environment:
      KIBAN_POSTGRES_DSN_FILE: /run/secrets/postgres_dsn
    secrets:
      - postgres_dsn
    volumes:
      - ${KIBAN_BACKUP_DIR:-./backups}:/backups
      - ${KIBAN_RECOVERY_REPORT_DIR:-./recovery-reports}:/recovery-reports
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

secrets:
  postgres_password:
    file: ${KIBAN_POSTGRES_PASSWORD_FILE:?KIBAN_POSTGRES_PASSWORD_FILE is required}
  postgres_dsn:
    file: ${KIBAN_POSTGRES_DSN_FILE:?KIBAN_POSTGRES_DSN_FILE is required}

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  worker-state:

networks:
  edge:
    internal: false
  backend:
    internal: true
