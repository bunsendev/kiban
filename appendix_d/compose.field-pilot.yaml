services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${KIBAN_FIELD_PILOT_DB_PASSWORD:?Field Pilot DB password is required}
    volumes:
      - ${KIBAN_FIELD_PILOT_BACKUP_DIR:?Field Pilot backup dir is required}:/var/lib/kiban/pilot-backup
  api:
    build:
      context: .
      dockerfile: Dockerfile.field-pilot
    environment:
      KIBAN_POSTGRES_DSN: postgresql://kiban:${KIBAN_FIELD_PILOT_DB_PASSWORD:?Field Pilot DB password is required}@postgres:5432/kiban
      KIBAN_FIELD_PILOT_MODE: "1"
      KIBAN_FIELD_PILOT_CONFIG: /var/lib/kiban/pilot/pilot-settings.json
      KIBAN_FIELD_PILOT_INBOX_POLICY: /var/lib/kiban/pilot/inbox-policy.json
      KIBAN_FIELD_PILOT_INBOX_ROOT: /var/lib/kiban/pilot-inbox
      KIBAN_FIELD_PILOT_SETTINGS_DIR: /var/lib/kiban/pilot-settings
      KIBAN_FIELD_PILOT_BACKUP_DIR: /var/lib/kiban/pilot-backup
      KIBAN_FIELD_PILOT_LEARNING_ADMIN_TOKEN: ${KIBAN_FIELD_PILOT_LEARNING_ADMIN_TOKEN:?Learning admin token is required}
      KIBAN_FIELD_PILOT_OPERATOR_ID: ${KIBAN_FIELD_PILOT_OPERATOR_ID:-FIELD_PILOT_OPERATOR}
      KIBAN_API_SUBJECT: field-pilot-local-admin
      KIBAN_ALLOWED_HOSTS: 127.0.0.1,localhost
    volumes:
      - ${KIBAN_FIELD_PILOT_CONFIG_DIR:?Field Pilot config dir is required}:/var/lib/kiban/pilot:ro
      - ${KIBAN_FIELD_PILOT_INBOX_DIR:?Field Pilot inbox dir is required}:/var/lib/kiban/pilot-inbox
      - ${KIBAN_FIELD_PILOT_SETTINGS_DIR:?Field Pilot settings dir is required}:/var/lib/kiban/pilot-settings
      - ${KIBAN_FIELD_PILOT_BACKUP_DIR:?Field Pilot backup dir is required}:/var/lib/kiban/pilot-backup
  pilot-inventory-worker:
    build:
      context: .
      dockerfile: Dockerfile.field-pilot
    command:
      - python
      - -m
      - forecast_provider.inventory_snapshot_worker_process
      - --postgres-dsn-env
      - --source-root
      - /var/lib/kiban/pilot-inbox/Archive
      - --worker-id
      - field-pilot-inventory-1
    environment:
      KIBAN_POSTGRES_DSN: postgresql://kiban:${KIBAN_FIELD_PILOT_DB_PASSWORD:?Field Pilot DB password is required}@postgres:5432/kiban
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_FIELD_PILOT_INBOX_DIR:?Field Pilot inbox dir is required}:/var/lib/kiban/pilot-inbox:ro
