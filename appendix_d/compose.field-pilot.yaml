services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${KIBAN_FIELD_PILOT_DB_PASSWORD:?Field Pilot DB password is required}
  api:
    build:
      context: .
      dockerfile: Dockerfile.field-pilot
    environment:
      KIBAN_POSTGRES_DSN: postgresql://kiban:${KIBAN_FIELD_PILOT_DB_PASSWORD:?Field Pilot DB password is required}@postgres:5432/kiban
      KIBAN_FIELD_PILOT_MODE: "1"
      KIBAN_FIELD_PILOT_CONFIG: /var/lib/kiban/pilot/pilot-settings.json
      KIBAN_FIELD_PILOT_INBOX_POLICY: /var/lib/kiban/pilot/inbox-policy.json
      KIBAN_FIELD_PILOT_INBOX_ROOT: /var/lib/kiban/pilot-inbox
      KIBAN_API_SUBJECT: field-pilot-local-admin
      KIBAN_ALLOWED_HOSTS: 127.0.0.1,localhost
    volumes:
      - ${KIBAN_FIELD_PILOT_CONFIG_DIR:?Field Pilot config dir is required}:/var/lib/kiban/pilot:ro
      - ${KIBAN_FIELD_PILOT_INBOX_DIR:?Field Pilot inbox dir is required}:/var/lib/kiban/pilot-inbox
