[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bunsen-forecast-provider"
version = "2.9.0"
description = "ForecastProvider契約とリファレンス実装（BUNSEN-FCST-IMPL-002 付録D v2.9）"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
postgres = ["psycopg[binary]>=3.2,<4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
test = ["httpx>=0.27,<1"]

[project.scripts]
kiban-worker = "forecast_provider.worker_process:main"
kiban-import-worker = "forecast_provider.ingestion_worker:main"
kiban-normalization-worker = "forecast_provider.normalization_worker:main"
kiban-matching-worker = "forecast_provider.matching_worker:main"
kiban-daily-worker = "forecast_provider.daily_worker:main"

[tool.setuptools.packages.find]
include = ["forecast_provider*"]

[tool.setuptools.package-data]
forecast_provider = [
    "jobs/migrations/*.sql",
    "catalog/*.sql",
    "ingestion/*.sql",
    "normalization/*.sql",
    "master/*.sql",
    "daily/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

# ruff のバージョンによって既定ルールセットが変わるため、明示的に固定する。
# ここを変更する場合は CODEX_START_HERE.md の期待値も同じコミットで更新すること。
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "C4", "B"]
ignore = [
    "RUF001",  # 全角記号を含む日本語コメント・docstringを許容する
    "RUF002",
    "RUF003",
]
