services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kiban
      POSTGRES_USER: kiban
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiban -d kiban"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kiban-postgres:/var/lib/postgresql/data
  api:
    build: .
    environment:
      KIBAN_POSTGRES_DSN: postgresql://kiban:local-development-only@postgres:5432/kiban
      KIBAN_API_TOKEN: ${KIBAN_API_TOKEN:-change-me-local}
    ports:
      - "127.0.0.1:58000:8000"
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --executor
      - ${KIBAN_EXECUTOR:-deployment.executor:execute}
      - --worker-id
      - worker-compose-1
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  kiban-postgres:
