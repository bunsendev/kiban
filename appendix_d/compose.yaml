services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kiban
      POSTGRES_USER: kiban
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiban -d kiban"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kiban-postgres:/var/lib/postgresql/data
  api:
    build: .
    environment:
      KIBAN_POSTGRES_DSN: postgresql://kiban:local-development-only@postgres:5432/kiban
      KIBAN_AUTH_MODE: token
      KIBAN_API_TOKEN: ${KIBAN_API_TOKEN:-change-me-local}
      KIBAN_API_SUBJECT: ${KIBAN_API_SUBJECT:-local-admin}
      KIBAN_DEPLOYMENT_MODE: development
      KIBAN_ALLOWED_HOSTS: 127.0.0.1,localhost,api
      KIBAN_SNAPSHOT_ROOT: /var/lib/kiban/snapshots
      KIBAN_REPORT_ROOT: /var/lib/kiban/reports
      KIBAN_MAPPING_DRY_RUN_DIR: /var/lib/kiban/mapping-dry-run
      KIBAN_IMPORT_ROOT: /var/lib/kiban/import-input
    ports:
      - "127.0.0.1:58000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots:ro
      - ${KIBAN_REPORT_DIR:-./report_output}:/var/lib/kiban/reports
      - ${KIBAN_MAPPING_DRY_RUN_DIR:-./mapping_dry_run_output}:/var/lib/kiban/mapping-dry-run:ro
      - ${KIBAN_IMPORT_DIR:-./import_input}:/var/lib/kiban/import-input:ro
  worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --builtin-baseline
      - --worker-id
      - worker-compose-1
      - --artifact-root
      - /var/lib/kiban/artifacts
      - --work-root
      - /var/lib/kiban/work
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - kiban-worker:/var/lib/kiban
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots:ro
  statsforecast-worker:
    profiles: ["statsforecast-worker"]
    build: .
    command:
      - kiban-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --statsforecast-ets
      - --worker-id
      - statsforecast-worker-compose-1
      - --artifact-root
      - /var/lib/kiban/artifacts
      - --work-root
      - /var/lib/kiban/work
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - kiban-worker:/var/lib/kiban
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots:ro
  mlforecast-worker:
    profiles: ["mlforecast-worker"]
    build: .
    command:
      - kiban-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --mlforecast-ridge
      - --worker-id
      - mlforecast-worker-compose-1
      - --artifact-root
      - /var/lib/kiban/artifacts
      - --work-root
      - /var/lib/kiban/work
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - kiban-worker:/var/lib/kiban
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots:ro
  timesfm-worker:
    profiles: ["timesfm-worker"]
    build:
      context: .
      args:
        KIBAN_INSTALL_TIMESFM_TORCH: "1"
    environment:
      KIBAN_TIMESFM_CHECKPOINT: /var/lib/kiban/timesfm/model.safetensors
    command:
      - kiban-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --timesfm-2p5
      - --worker-id
      - timesfm-worker-compose-1
      - --artifact-root
      - /var/lib/kiban/artifacts
      - --work-root
      - /var/lib/kiban/work
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - kiban-worker:/var/lib/kiban
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots:ro
      - ${KIBAN_TIMESFM_DIR:-./timesfm_checkpoint}:/var/lib/kiban/timesfm:ro
    deploy:
      resources:
        limits:
          cpus: ${KIBAN_TIMESFM_CPUS:-2.0}
          memory: ${KIBAN_TIMESFM_MEMORY:-4G}
  timesfm-benchmark:
    profiles: ["timesfm-benchmark"]
    build:
      context: .
      args:
        KIBAN_INSTALL_TIMESFM_TORCH: "1"
    environment:
      KIBAN_TIMESFM_CHECKPOINT: /var/lib/kiban/timesfm/model.safetensors
    command:
      - kiban-timesfm-benchmark
      - --output-root
      - /var/lib/kiban/benchmark
      - --cpu-limit
      - ${KIBAN_TIMESFM_CPUS:-2.0}
      - --memory-limit-bytes
      - ${KIBAN_TIMESFM_MEMORY_BYTES:-4294967296}
      - --max-peak-rss-bytes
      - ${KIBAN_TIMESFM_MEMORY_BYTES:-4294967296}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_TIMESFM_DIR:-./timesfm_checkpoint}:/var/lib/kiban/timesfm:ro
      - ${KIBAN_TIMESFM_BENCHMARK_DIR:-./timesfm_benchmark_output}:/var/lib/kiban/benchmark
    deploy:
      resources:
        limits:
          cpus: ${KIBAN_TIMESFM_CPUS:-2.0}
          memory: ${KIBAN_TIMESFM_MEMORY:-4G}
  import-worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-import-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --input-root
      - /var/lib/kiban/import-input
      - --archive-root
      - /var/lib/kiban/raw-archive
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_IMPORT_DIR:-./import_input}:/var/lib/kiban/import-input:ro
      - ${KIBAN_RAW_ARCHIVE_DIR:-./raw_archive}:/var/lib/kiban/raw-archive
  normalization-worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-normalization-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_RAW_ARCHIVE_DIR:-./raw_archive}:/var/lib/kiban/raw-archive:ro
  matching-worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-matching-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
    depends_on:
      postgres:
        condition: service_healthy
  daily-worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-daily-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --output-root
      - /var/lib/kiban/snapshots
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots
  acceptance-worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-acceptance-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --output-root
      - /var/lib/kiban/acceptance
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots:ro
      - ${KIBAN_ACCEPTANCE_DIR:-./acceptance_output}:/var/lib/kiban/acceptance
  real-data-preflight:
    profiles: ["preflight"]
    build: .
    command:
      - kiban-real-data-preflight
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --application-root
      - /app
      - --import-root
      - /var/lib/kiban/import-input
      - --archive-root
      - /var/lib/kiban/raw-archive
      - --snapshot-root
      - /var/lib/kiban/snapshots
      - --acceptance-root
      - /var/lib/kiban/acceptance
      - --output-root
      - /var/lib/kiban/preflight
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_IMPORT_DIR:-./import_input}:/var/lib/kiban/import-input:ro
      - ${KIBAN_RAW_ARCHIVE_DIR:-./raw_archive}:/var/lib/kiban/raw-archive
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots
      - ${KIBAN_ACCEPTANCE_DIR:-./acceptance_output}:/var/lib/kiban/acceptance
      - ${KIBAN_PREFLIGHT_DIR:-./preflight_output}:/var/lib/kiban/preflight
  oidc-preflight:
    profiles: ["preflight"]
    build: .
    command:
      - kiban-oidc-preflight
      - --issuer
      - ${KIBAN_OIDC_ISSUER:-https://id.example.test/tenant}
      - --authorization-url
      - ${KIBAN_OIDC_AUTHORIZATION_URL:-https://id.example.test/tenant/authorize}
      - --token-url
      - ${KIBAN_OIDC_TOKEN_URL:-https://id.example.test/tenant/token}
      - --jwks-url
      - ${KIBAN_OIDC_JWKS_URL:-https://id.example.test/tenant/jwks}
      - --algorithms
      - ${KIBAN_OIDC_ALGORITHMS:-RS256}
      - --output-root
      - /var/lib/kiban/oidc-preflight
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_OIDC_PREFLIGHT_DIR:-./oidc_preflight_output}:/var/lib/kiban/oidc-preflight
  mapping-dry-run:
    profiles: ["mapping-preflight"]
    build: .
    command:
      - kiban-mapping-dry-run
      - --input-root
      - /var/lib/kiban/import-input
      - --source
      - ${KIBAN_MAPPING_SOURCE:-sample.csv}
      - --mapping-file
      - /etc/kiban/mapping.json
      - --output-root
      - /var/lib/kiban/mapping-dry-run
      - --sample-rows
      - ${KIBAN_MAPPING_SAMPLE_ROWS:-1000}
      - --max-source-bytes
      - ${KIBAN_MAPPING_MAX_SOURCE_BYTES:-100000000}
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_IMPORT_DIR:-./import_input}:/var/lib/kiban/import-input:ro
      - ${KIBAN_MAPPING_FILE:-./deploy/mapping.example.json}:/etc/kiban/mapping.json:ro
      - ${KIBAN_MAPPING_DRY_RUN_DIR:-./mapping_dry_run_output}:/var/lib/kiban/mapping-dry-run
  mapping-dry-run-worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-mapping-dry-run-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --input-root
      - /var/lib/kiban/import-input
      - --output-root
      - /var/lib/kiban/mapping-dry-run
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_IMPORT_DIR:-./import_input}:/var/lib/kiban/import-input:ro
      - ${KIBAN_MAPPING_DRY_RUN_DIR:-./mapping_dry_run_output}:/var/lib/kiban/mapping-dry-run
  selection-worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-selection-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
    depends_on:
      postgres:
        condition: service_healthy
  lifecycle-scheduler:
    profiles: ["worker"]
    build: .
    command:
      - kiban-lifecycle-scheduler
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --poll-seconds
      - "60"
    depends_on:
      postgres:
        condition: service_healthy
  db-operations:
    profiles: ["operations"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.operations
    environment:
      KIBAN_POSTGRES_DSN: postgresql://kiban:local-development-only@postgres:5432/kiban
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${KIBAN_BACKUP_DIR:-./deploy/backups}:/backups
      - ${KIBAN_RECOVERY_REPORT_DIR:-./recovery_output}:/recovery-reports

volumes:
  kiban-postgres:
  kiban-worker:
