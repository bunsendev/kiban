services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kiban
      POSTGRES_USER: kiban
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiban -d kiban"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kiban-postgres:/var/lib/postgresql/data
  api:
    build: .
    environment:
      KIBAN_POSTGRES_DSN: postgresql://kiban:local-development-only@postgres:5432/kiban
      KIBAN_API_TOKEN: ${KIBAN_API_TOKEN:-change-me-local}
      KIBAN_SNAPSHOT_ROOT: /var/lib/kiban/snapshots
    ports:
      - "127.0.0.1:58000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots:ro
  worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --builtin-baseline
      - --worker-id
      - worker-compose-1
      - --artifact-root
      - /var/lib/kiban/artifacts
      - --work-root
      - /var/lib/kiban/work
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - kiban-worker:/var/lib/kiban
      - ${KIBAN_SNAPSHOT_DIR:-./snapshot_input}:/var/lib/kiban/snapshots:ro
  import-worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-import-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
      - --input-root
      - /var/lib/kiban/import-input
      - --archive-root
      - /var/lib/kiban/raw-archive
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_IMPORT_DIR:-./import_input}:/var/lib/kiban/import-input:ro
      - ${KIBAN_RAW_ARCHIVE_DIR:-./raw_archive}:/var/lib/kiban/raw-archive
  normalization-worker:
    profiles: ["worker"]
    build: .
    command:
      - kiban-normalization-worker
      - --postgres-dsn
      - postgresql://kiban:local-development-only@postgres:5432/kiban
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${KIBAN_RAW_ARCHIVE_DIR:-./raw_archive}:/var/lib/kiban/raw-archive:ro

volumes:
  kiban-postgres:
  kiban-worker:
