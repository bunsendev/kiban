services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kiban
      POSTGRES_USER: kiban
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiban -d kiban"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - kiban-postgres:/var/lib/postgresql/data

volumes:
  kiban-postgres:
